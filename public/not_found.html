<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina Non Trovata - MicioCode</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f3f4f6;
        color: #1f2937;
        text-align: center;
      }
      .container {
        max-width: 500px;
        padding: 3rem 2rem;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
      h1 {
        font-size: 6rem;
        margin: 0 0 1rem 0;
        color: #ef4444;
        line-height: 1;
        font-weight: 800;
      }
      h2 {
        font-size: 1.5rem;
        margin-top: 0;
        margin-bottom: 1rem;
        color: #111827;
      }
      p {
        margin-bottom: 2rem;
        color: #6b7280;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background-color: #3b82f6;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background-color 0.2s, transform 0.1s;
      }
      a:hover {
        background-color: #2563eb;
      }
      a:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Pagina Non Trovata</h2>
      <p>Ops! Sembra che tu abbia scritto un indirizzo che non esiste o che la pagina sia stata rimossa.</p>
      <a href="/">Torna alla Home di MicioCode</a>
    </div>
  </body>
</html>
